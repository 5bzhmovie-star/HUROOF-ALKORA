name: Windows portable build
on:
  push:
    branches: [development/source-import, development/native-v1.3, development/questions-reset-v1.4.0, development/visual-questions-v1.4]
    paths:
      - 'website/**'
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile application and run tests
        shell: pwsh
        run: ./desktop/scripts/Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Huroof-AlKora-Windows-x64
          path: |
            desktop/dist/Huroof-AlKora-Windows-v1.4.0-x64.zip
            desktop/dist/Huroof-AlKora-Windows-v1.4.0-x64.zip.sha256.txt
          if-no-files-found: error
